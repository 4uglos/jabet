<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Translations</title>
<style>
  :root {
    --bg: #f1eff7;
    --card: #dcd9e1;
    --sub: #d0cdd6;
    --text: #3b3842;
    --muted: #8a8693;
    --accent: #6a3fd1;
    --new: #e0218a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Roboto, Arial, sans-serif; font-size: 14px;
  }
  .wrap { max-width: 380px; margin: 0 auto; padding: 16px; }

  .langs {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; gap: 6px; padding: 8px 0 12px;
  }
  .langs button {
    flex: 1; border: 1px solid #c9c5d1; background: #fff; color: var(--text);
    border-radius: 8px; padding: 8px 0; font-weight: 600; cursor: pointer;
  }
  .langs button { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .flag { width: 20px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.15); flex: none; }
  .langs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .group { background: var(--card); border-radius: 8px; padding: 6px 8px 8px; margin-bottom: 8px; }
  .item {
    position: relative; display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; min-height: 42px;
  }
  .group > .item { padding: 6px 4px; margin: 0 0 4px; }
  .sub {
    position: relative; background: var(--sub); border-radius: 12px;
    padding: 9px 22px; margin: 0 0 6px; min-height: 34px;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.06);
  }
  .sub:last-child { margin-bottom: 0; }
  .ico { width: 24px; text-align: center; font-size: 18px; flex: none; }
  .labels { flex: 1; }
  .chev { color: var(--muted); }
  .en { display: block; }
  .tr { display: none; font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 2px; }
  .tr.missing { color: var(--muted); font-weight: 400; font-style: italic; }
  body:not([data-lang="en"]) .tr { display: block; }

  .cnt {
    background: #f59e0b; color: #fff; font-size: 10px; font-weight: 800;
    border-radius: 9px; padding: 1px 6px; line-height: 14px;
  }
  .issue { display: none; font-size: 12px; color: #b45309; margin-top: 3px; line-height: 1.35; }
  .issue b { color: #15803d; font-weight: 700; }
  body.show-issues .has-issue { box-shadow: inset 0 0 0 2px #f59e0b; }
  body.show-issues .has-issue .issue { display: block; }
  .summary { margin-top: 16px; background: #fff; border-radius: 8px; padding: 12px 14px; font-size: 13px; }
  .summary h3 { margin: 0 0 8px; font-size: 14px; }
  .summary ol { margin: 0; padding-left: 18px; }
  .summary li { margin-bottom: 6px; }
  .summary .ok { color: #15803d; }
  body:not(.show-issues) .summary { display: none; }
  .new {
    position: absolute; top: -4px; right: -2px; background: var(--new); color: #fff;
    font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 3px; letter-spacing: .5px;
  }
</style>
</head>
<body data-lang="en">
<div class="wrap">
  <div class="langs">
    <button data-l="en" class="active"><svg class="flag" viewBox="0 0 60 30"><clipPath id="uk"><path d="M0 0v30h60V0z"/></clipPath><clipPath id="ukt"><path d="M30 15h30v15zv15H0zH0V0zV0h30z"/></clipPath><g clip-path="url(#uk)"><path d="M0 0v30h60V0z" fill="#012169"/><path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30m0-30L0 30" clip-path="url(#ukt)" stroke="#C8102E" stroke-width="4"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg>EN</button>
    <button data-l="pb"><svg class="flag" viewBox="0 0 60 42"><rect width="60" height="42" fill="#009C3B"/><path d="M30 5 L55 21 L30 37 L5 21Z" fill="#FFDF00"/><circle cx="30" cy="21" r="9" fill="#002776"/><path d="M21.5 19.5 Q30 17 38.6 22.5" stroke="#fff" stroke-width="1.6" fill="none"/></svg>PB</button>
    <button data-l="es"><svg class="flag" viewBox="0 0 60 40"><rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/></svg>ES</button>
    <button data-l="fr"><svg class="flag" viewBox="0 0 60 40"><rect width="20" height="40" fill="#002654"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#CE1126"/></svg>FR</button>
  </div>
  <nav id="menu"></nav>
  <div class="summary" id="summary"></div>
</div>

<script>
// Структура меню (английская версия). id — уникальный ключ пункта.
// badge — текст бейджа в английской версии.
const MENU = [
  { id: "live", en: "Live", icon: "◉", children: [
    { id: "live.event_view", en: "Event View" },
    { id: "live.sport_tournaments", en: "Sport Tournaments" },
    { id: "live.calendar", en: "Live Calendar" }
  ]},
  { id: "sports", en: "Sports", icon: "⚽", children: [
    { id: "sports.event_view", en: "Event View" },
    { id: "sports.calendar", en: "Live Calendar" },
    { id: "sports.statistics", en: "Statistics" }
  ]},
  { id: "casino", en: "Casino", icon: "🎰", children: [
    { id: "casino.home", en: "Home" },
    { id: "casino.tournaments", en: "Tournaments" },
    { id: "casino.jackpots", en: "Jackpots" },
    { id: "casino.live_rtp", en: "Live RTP", badge: "NEW" }
  ]},
  { id: "promotions", en: "Promotions", icon: "🎁" },

  { id: "live_casino", en: "Live casino", icon: "🃏" },
  { id: "eventbook", en: "Eventbook", icon: "📊" },
  { id: "games", en: "Games", icon: "🎲" },
  { id: "tournaments", en: "Tournaments", icon: "🏆" },
  { id: "virtual_betting", en: "Virtual Betting", icon: "🏇" },
  { id: "brazil_serie_a", en: "Brazil Serie A", icon: "🛡️", badge: "NEW" },
  { id: "social", en: "Social", icon: "👥", badge: "NEW" },
  { id: "wheel", en: "Powerfull Wheel", icon: "🎡" },
  { id: "poker", en: "Poker", icon: "♠️" }
];

// Переводы по скринам. text — подпись, badge — бейдж на экране этого языка (null = бейджа нет).
const T = {
  pb: {

    "casino":                 { text: "Cassino" },

    "casino.tournaments":     { text: "Torneios" },
    "casino.jackpots":        { text: "Jackpots" },
    "casino.live_rtp":        { text: "Casino Live RTP", badge: null },
    "promotions":             { text: "Promoções" },
    "sport_reel":             { text: "Sport Reel", badge: "NOVO" },
    "live_casino":            { text: "Cassino ao vivo" },
    "eventbook":              { text: "Eventbook" },
    "games":                  { text: "Jogos" },
    "tournaments":            { text: "Torneios" },
    "virtual_betting":        { text: "Esportes Virtuais" },
    "brazil_serie_a":         { text: "Brazil Seria A", badge: "NOVO" },
    "social":                 { text: "Social", badge: "NOVO" },
    "wheel":                  { text: "Roda" },
    "poker":                  { text: "Pôquer" }
  },
  es: {
    "live":                   { text: "En vivo" },
    "live.event_view":        { text: "Vista del Evento" },
    "live.sport_tournaments": { text: "Torneos deportivos" },
    "live.calendar":          { text: "Calendario en Vivo" },
    "sports":                 { text: "Deportes" },
    "sports.event_view":      { text: "Vista del Evento" },
    "sports.calendar":        { text: "Calendario en Vivo" },
    "sports.statistics":      { text: "Estatísticas" },
    "casino":                 { text: "Casino" },
    "casino.home":            { text: "Inicio" },
    "casino.tournaments":     { text: "Torneos" },
    "casino.jackpots":        { text: "Jackpots" },
    "casino.live_rtp":        { text: "Casino Live RTP", badge: null },
    "promotions":             { text: "Promociones" },

    "live_casino":            { text: "Casino en Vivo" },

    "virtual_betting":        { text: "Esportes Virtuais" },
    "brazil_serie_a":         { text: "Brazil Seria A", badge: "NUEVO" },
    "social":                 { text: "Social (test)", badge: "NUEVO" },
    "wheel":                  { text: "Roda" },
    "poker":                  { text: "Póker" }
  },
  fr: {
    "live":                   { text: "Paris en Direct" },
    "live.event_view":        { text: "Vue d'événement" },
    "live.sport_tournaments": { text: "Tournois Sportifs" },
    "live.calendar":          { text: "Calendrier en direct" },
    "sports":                 { text: "Esportes" },
    "sports.event_view":      { text: "Vue d'événement" },
    "sports.calendar":        { text: "Calendrier en direct" },
    "sports.statistics":      { text: "Estatísticas" },
    "casino":                 { text: "Casino" },
    "casino.home":            { text: "Accueil" },
    "casino.tournaments":     { text: "Tournois" },
    "casino.jackpots":        { text: "Jackpots" },
    "casino.live_rtp":        { text: "Casino Live RTP", badge: null },
    "promotions":             { text: "Promotions" },
    "sport_reel":             { text: "Sport Reel", badge: "NOVO" },
    "live_casino":            { text: "Casino en ligne" },
    "eventbook":              { text: "Eventbook" },
    "games":                  { text: "jeux" },
    "tournaments":            { text: "Torneios" },
    "virtual_betting":        { text: "Esportes Virtuais" },
    "brazil_serie_a":         { text: "Brazil Seria A", badge: "NOUVEAU" },
    "social":                 { text: "Social (test)", badge: "NOUVEAU" },
    "wheel":                  { text: "Roda" },
    "poker":                  { text: "Poker" }
  }
};

// Замечания: problem — что не так, fix — предлагаемый вариант.
const ISSUES = {
  en: {
    "wheel":            { problem: "Опечатка «Powerfull» в оригинале", fix: "Powerful Wheel" }
  },
  pb: {
    "sports.calendar":  { problem: "Регистр отличается от Live («ao vivo»)", fix: "Calendário ao vivo" },
    "casino.live_rtp":  { problem: "«Casino» внутри группы «Cassino»; нет бейджа NEW", fix: "Live RTP + бейдж NOVO" },
    "virtual_betting":  { problem: "Смысл: «Виртуальный спорт», а в EN «Виртуальные ставки»", fix: "Apostas Virtuais" },
    "brazil_serie_a":   { problem: "Опечатка «Seria»; «Brazil» не переведено", fix: "Brasileirão Série A" },
    "wheel":            { problem: "Неполный перевод: потеряно «Powerful»", fix: "Roda Poderosa" }
  },
  es: {
    "sports.statistics":{ problem: "Португальское написание", fix: "Estadísticas" },
    "casino.live_rtp":  { problem: "Лишнее «Casino»; нет бейджа NEW", fix: "Live RTP + бейдж NUEVO" },
    "sport_reel":       { problem: "Бейдж на португальском (NOVO)", fix: "NUEVO" },
    "tournaments":      { problem: "Португальский; в Casino уже «Torneos»", fix: "Torneos" },
    "virtual_betting":  { problem: "Португальский, и смысл «Виртуальный спорт» вместо «Виртуальные ставки»", fix: "Apuestas Virtuales" },
    "brazil_serie_a":   { problem: "Опечатка «Seria»; «Brazil» не переведено", fix: "Brasil Serie A" },
    "social":           { problem: "Служебный хвост «(test)»", fix: "Social" },
    "wheel":            { problem: "Португальский; потеряно «Powerful»", fix: "Rueda Poderosa" }
  },
  fr: {
    "live":             { problem: "«Paris en Direct» = «Ставки в прямом эфире»; в других языках просто «Live»", fix: "En direct" },
    "live.event_view":  { problem: "Неестественная грамматика", fix: "Vue de l'événement" },
    "sports.event_view":{ problem: "Неестественная грамматика", fix: "Vue de l'événement" },
    "sports":           { problem: "Португальский", fix: "Sports" },
    "sports.statistics":{ problem: "Португальский", fix: "Statistiques" },
    "casino.live_rtp":  { problem: "Лишнее «Casino»; нет бейджа NEW", fix: "Live RTP + бейдж NOUVEAU" },
    "sport_reel":       { problem: "Бейдж на португальском (NOVO)", fix: "NOUVEAU" },
    "live_casino":      { problem: "«en ligne» = онлайн, а не live", fix: "Casino en direct" },
    "games":            { problem: "Строчная буква", fix: "Jeux" },
    "tournaments":      { problem: "Португальский; в Casino уже «Tournois»", fix: "Tournois" },
    "virtual_betting":  { problem: "Португальский, и смысл «Виртуальный спорт» вместо «Виртуальные ставки»", fix: "Paris virtuels" },
    "brazil_serie_a":   { problem: "Опечатка «Seria»; «Brazil» не переведено", fix: "Brésil Série A" },
    "social":           { problem: "Служебный хвост «(test)»", fix: "Social" },
    "wheel":            { problem: "Португальский; потеряно «Powerful»", fix: "Roue Puissante" }
  }
};

function labels(o) {
  return `<span class="en">${o.en}</span><span class="tr" data-id="${o.id}"></span><span class="issue" data-id="${o.id}"></span>`;
}
const badge = o => `<span class="new" data-id="${o.id}" data-en="${o.badge || ""}"${o.badge ? "" : " hidden"}>${o.badge || ""}</span>`;

function render() {
  document.getElementById("menu").innerHTML = MENU.map(m => {
    const head = `<div class="item"><span class="ico">${m.icon}</span><span class="labels">${labels(m)}</span>${m.children ? '<span class="chev">⌄</span>' : ''}${badge(m)}</div>`;
    if (!m.children) return head;
    const subs = m.children.map(c => `<div class="sub">${labels(c)}${badge(c)}</div>`).join("");
    return `<div class="group">${head}${subs}</div>`;
  }).join("");
}

function setLang(l) {
  document.body.dataset.lang = l;
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("active", b.dataset.l === l));
  const dict = T[l] || {};
  const hasData = Object.keys(dict).length > 0;

  document.querySelectorAll(".tr").forEach(el => {
    const v = dict[el.dataset.id];
    el.textContent = v ? v.text : "— нет перевода";
    el.classList.toggle("missing", !v);
  });

  document.querySelectorAll(".new").forEach(el => {
    let txt = el.dataset.en;
    if (l !== "en" && hasData) {
      const v = dict[el.dataset.id];
      if (v && "badge" in v) txt = v.badge || "";
    }
    el.textContent = txt;
    el.hidden = !txt;
  });

  // Замечания
  const iss = ISSUES[l] || {};
  document.querySelectorAll(".issue").forEach(el => {
    const v = iss[el.dataset.id];
    el.innerHTML = v ? `⚠ ${v.problem} → <b>${v.fix}</b>` : "";
    el.closest(".item, .sub").classList.toggle("has-issue", !!v);
  });

  const allItems = MENU.flatMap(m => [m, ...(m.children || [])]);
  const list = allItems.filter(o => iss[o.id]).map(o => {
    const v = iss[o.id];
    return `<li><b>${o.en}</b>: «${l === "en" ? o.en : (dict[o.id]?.text ?? "—")}» — ${v.problem} → <span class="ok">${v.fix}</span></li>`;
  });
  document.getElementById("summary").innerHTML =
    `<h3>Замечания (${l.toUpperCase()}): ${list.length}</h3>` + (list.length ? `<ol>${list.join("")}</ol>` : `<span class="ok">Замечаний нет</span>`);
}

render();
document.querySelectorAll(".langs button").forEach(b => {
  const n = Object.keys(ISSUES[b.dataset.l] || {}).length;
  if (n) b.insertAdjacentHTML("beforeend", `<span class="cnt">${n}</span>`);
  b.onclick = () => setLang(b.dataset.l);
});
document.body.classList.add("show-issues");
setLang("en");
</script>
</body>
</html>
